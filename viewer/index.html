<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Ханукия — просмотр</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1f22;
        color: #ddd;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
      }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 320px;
        background: #26292dcc;
        padding: 12px 14px;
        border-radius: 8px;
        backdrop-filter: blur(4px);
      }
      #ui h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #ui label {
        display: block;
        margin: 6px 0;
      }
      #ui input[type='range'] {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      #list {
        max-height: 45vh;
        overflow: auto;
        margin-top: 8px;
        font-size: 12px;
      }
      #list table {
        width: 100%;
        border-collapse: collapse;
      }
      #list td {
        padding: 2px 4px;
        border-bottom: 1px solid #3a3d42;
      }
      #list tr.hl td {
        background: #4a5a3a;
      }
      #ui a {
        color: #c9b27c;
      }
      #credits {
        margin-top: 8px;
        font-size: 11px;
        color: #8a8f96;
      }
      #status {
        margin-top: 6px;
        color: #9a9;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>Ханукия</h1>
      <div class="row">
        <label><input type="radio" name="mode" value="assembly" checked /> Сборка</label>
        <label><input type="radio" name="mode" value="print" /> Детали для печати</label>
      </div>
      <label>Разнести детали <input id="explode" type="range" min="0" max="120" value="0" /></label>
      <label><input id="wire" type="checkbox" /> Каркас</label>
      <div id="list"></div>
      <div id="status">загрузка…</div>
      <div id="credits">
        Chanukia Lemon · автор PHPCraftdream ·
        <a href="https://github.com/PHPCraftdream/chanukia-lemon">исходники на GitHub</a> · GPL-3.0
      </div>
    </div>
  </body>
</html>
